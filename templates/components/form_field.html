<div class="form-field" style="margin-block:1rem">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.id_for_label }}-help" class="field-help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <ul class="field-errors" role="alert">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
