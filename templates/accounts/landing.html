{% extends "base.html" %}
{% block title %}Signed in — Nelna FG{% endblock %}
{% block content %}
  <section class="foundation-home" aria-labelledby="landing-heading">
    <h1 id="landing-heading">{{ phase_label }}</h1>
    <p>{{ message }}</p>
    <ul>
      <li>
        <a href="{% url 'accounts:change_password' %}">Change password</a>
      </li>
      <li>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="underline">Sign out</button>
        </form>
      </li>
    </ul>
  </section>
{% endblock %}
